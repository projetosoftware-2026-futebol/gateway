services:
  gateway:
    image: "projetosoftwarefutebol/gateway"
    container_name: gateway
    ports:
      - "80:80"
    networks:
      - network
    environment:
      CLUBE_URL: http://clube:5000
      JOGADOR_URL: http://jogador:5001
      JOGOS_URL: http://jogos:5002
    depends_on:
      - clube
      - jogador
      - jogos
    restart: unless-stopped

  clube:
    image: "projetosoftwarefutebol/clube"
    container_name: clube
    ports:
      - "5000:5000"
    networks:
      - network
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: football-password
      MYSQL_DATABASE: football
      CLUBE_URL: http://clube:5000
      JOGADOR_URL: http://jogador:5001
      JOGOS_URL: http://jogos:5002
    depends_on:
      - mysql
    restart: unless-stopped

  jogador:
    image: "projetosoftwarefutebol/jogador"
    container_name: jogador
    ports:
      - "5001:5000"
    networks:
      - network
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: football-password
      MYSQL_DATABASE: football
      CLUBE_URL: http://clube:5000
      JOGADOR_URL: http://jogador:5001
      JOGOS_URL: http://jogos:5002
    depends_on:
      - mysql
    restart: unless-stopped

  jogos:
    image: "projetosoftwarefutebol/jogos"
    container_name: jogos
    ports:
      - "5002:5000"
    networks:
      - network
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: football-password
      MYSQL_DATABASE: football
      CLUBE_URL: http://clube:5000
      JOGADOR_URL: http://jogador:5001
      JOGOS_URL: http://jogos:5002
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: football-password
      MYSQL_DATABASE: football
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - data:/var/lib/mysql
    networks:
      - network
    restart: unless-stopped

volumes:
  data:

networks:
  network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
