services:
  gateway:
    image: "projetosoftwarefutebol/gateway"
    pull_policy: always
    container_name: gateway
    ports:
      - "80:80"
    networks:
      - network
    environment:
      CLUBE_URL: http://clube:5000
      JOGADOR_URL: http://jogador:5000
      JOGOS_URL: http://jogos:5000
    depends_on:
      - clube
      - jogador
      - jogos
    restart: unless-stopped

  clube:
    image: "projetosoftwarefutebol/clube"
    pull_policy: always
    container_name: clube
    networks:
      - network
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: football-password
      MYSQL_DATABASE: football
      CLUBE_URL: http://clube:5000
      JOGADOR_URL: http://jogador:5000
      JOGOS_URL: http://jogos:5000
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  jogador:
    image: "projetosoftwarefutebol/jogador"
    pull_policy: always
    container_name: jogador
    networks:
      - network
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: football-password
      MYSQL_DATABASE: football
      CLUBE_URL: http://clube:5000
      JOGADOR_URL: http://jogador:5000
      JOGOS_URL: http://jogos:5000
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  jogos:
    image: "projetosoftwarefutebol/jogos"
    pull_policy: always
    container_name: jogos
    networks:
      - network
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: football-password
      MYSQL_DATABASE: football
      CLUBE_URL: http://clube:5000
      JOGADOR_URL: http://jogador:5000
      JOGOS_URL: http://jogos:5000
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    pull_policy: missing
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: football-password
      MYSQL_DATABASE: football
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - data:/var/lib/mysql
    networks:
      - network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  data:

networks:
  network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
